<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GUUmedicare</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="assets/imgs/guu-logo-favicon.png">
    </head>
    <body>
        <header>
            <h1>Create a <em>Medicare</em> Account</h1>
            <img src="assets/imgs/guu-logo.png">
        </header>
        <div class="wrapper">
            <!-- Chronic illnesses -->
            <label for="">Does the student have any chronic illnesses or medical conditions?</label>
            <div class="input" >
                <label for="yes-illness">Yes
                    <input type="radio" id="yes-illness" name="illness" style="height: 25px;">
                </label>
            </div>
            <div class="input" >
                <label for="no-illness">No
                    <input type="radio" id="no-illness" name="illness" style="height: 25px;">
                </label>
            </div>
            <div class="input"><input type="text" placeholder="If yes, list them"></div>
            <h2 style="font-size: medium; font-style: italic; font-weight: lighter;">Please, these information are confidential. Don't disclose to anyone. Thank you</h2><br>
            <a href="surgeries.html"><button class="btn">Next</button></a>
            
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
