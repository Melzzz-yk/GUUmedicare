        <!-- Allergies -->
        <label for="">Does the student have any allergies (food, medication, insects, environmental)?</label>

        </div>
        <div class="input" >
            <label for="no-allergies">No
                <input type="radio" id="no-allergies" name="allergies" style="height: 25px;">
            </label>
        </div>
        <div class="input"><input type="text" placeholder="If yes, list them"></div>
         <h2 style="font-size: medium; font-style: italic; font-weight: lighter;">Please, these information are confidential. Don't disclose to anyone. Thank you</h2><br>
