<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUUmedicare</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/imgs/guu-logo-favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
</head>
</head>
<body>
   <header>
        <h1>Create a <em>Medicare</em> Account</h1>
        <img src="assets/imgs/guu-logo.png">
    </header>
    <div class="wrapper">
        <div class="input"><input placeholder="Firstname" required type="text"></div>
        <div class="input"><input placeholder="Lastname" required type="text"></div>
        <div class="input"><input placeholder="Middlename" type="text"></div>
        <div class="input"><input type="text" placeholder="Date of Birth" onfocus="(this.type = 'date')" onblur="if('!this.value') this.type('text')" required></div>
        <div class="input"><input type="text" placeholder="Height"></div>
        <div class="input"><input type="text" placeholder="Weight"></div>
        <div class="input"><input type="text" placeholder="Sex" required></div>
        <div class="input"><input type="email" placeholder="Email"></div>
        <div class="input"><input type="tel" placeholder="Phone Number" pattern="(\+[2-4]{3}[0-9]{3}[0-9]{3}[0-9]{4}) | ([0-9]{11})"></div>
        <div class="input"><input type="text" placeholder="House Address"></div>
        <div class="input"><input type="text" placeholder="Guardian's Name" required></div>
        <div class="input"><input type="text" placeholder="Guardian's Number" type="tel" pattern="(\+[2-4]{3}[0-9]{3}[0-9]{3}[0-9]{4} | ([0-9]{11}))" required></div>
        <div class="input"><input placeholder="Password" type="password" required minlength="5" maxlength="15"></div><br>
        <h2 style="font-size: medium; font-style: italic; font-weight: lighter;">Please, these information are confidential. Don't disclose to anyone. Thank you</h2><br>
        <a href="sign-up-contd.html"><button class="btn">Next</button></a>
    </div>
    <script src="script.js"></script>  
</body>
</html>
