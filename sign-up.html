<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GUUmedicare</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="assets/imgs/guu-logo-favicon.png">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    </head>
    <body>
    <header>
            <h1>Create a <em>Medicare</em> Account</h1>
            <img src="assets/imgs/guu-logo.png">
        </header>
        <div class="wrapper">
            <form action="" class="form-wizard">
                <h1>Registration</h1>
                <div class="progress-container">
                    <div class="progress"></div>
                    <ol>
                        <li>Personal</li>
                        <li>School</li>
                        <li>Account</li>
                    </ol>
                </div>
                <section>
                    <label for="first-name">First Name</label>
                    <input type="text" name="firstName" id="first-name"><br>
                    <label for="last-name">Last Name</label>
                    <input type="text" name="lastName" id="last-name"><br>
                    <label for="date-of-birth">Date Of Birth</label>
                    <input type="date" name="dateOfBirth" id="date-of-birth">
                    
                    <p>Gender</p>
                    <input type="radio" name="gender" id="male" value="male">
                    <label for="male">Male</label><br>
                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">Female</label>
                </section>
                <section>
                    <label for="matric-number">Matric Number</label>
                    <input type="text" name="matricNo" id="matric-number"><br>
                    <label for="college">College</label>
                    <input type="text" name="college" id="college">
                    <label for="department">Department</label>
                    <input type="text" name="department" id="department"><br>
                    <label for="level">Level</label>
                    <input type="text" name="level" id="level">
                </section>
                <section>
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email"><br>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password"><br>
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" name="confirmPassword" id="confirm-password"><br>

                </section>
            </form>
        <script src="script.js"></script>  
    </body>
</html>
