<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>GUUmedicare</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/imgs/guu-logo-favicon.png">
</head>
<body>
    <header>
        <h1>Create a <em>Medicare</em> Account</h1>
        <img src="assets/imgs/guu-logo.png">
    </header>
    <div class="wrapper">
        <!-- Regular Medications -->
         <label for="">Does the student take any regular medications?</label>
        <div class="input" >
            <label for="yes-medications">Yes
                <input type="radio" id="yes-medications" name="medications" style="height: 25px;">
            </label>
        </div>
        <div class="input" >
            <label for="no-medications">No
                <input type="radio" id="no-medications" name="medications" style="height: 25px;">
            </label>
        </div>
        <div class="input"><input type="text" placeholder="If yes, list them"></div>
             <h2 style="font-size: medium; font-style: italic; font-weight: lighter;">Please, these information are confidential. Don't disclose to anyone. Thank you</h2><br>
        <a href=""><button class="btn">Create an Account</button></a>
    </div>
    <script src="script.js"></script>
</body>
</html>
